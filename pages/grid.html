<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>组别分工</title>
    <link rel="stylesheet" href="../../../renderer/remixicon-local.css" />
    <link rel="stylesheet" href="../../../renderer/settings.css" />
      <style>
        :root {
          --bg: #181818;
          --fg: #e6e6e6;
          --muted: #aaa;
          --accent: #6ab4ff;
          --accent-rgb: 106, 180, 255;
          --panel: rgba(255, 255, 255, 0.04);
          --item-bg: rgba(255, 255, 255, 0.04);
          --border: #2a2a2a;
        }
        
        html, body {
          height: 100%;
          user-select: none;
          transition: background 0.3s, color 0.3s;
        }
        
        body {
          margin: 0;
          font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft YaHei", sans-serif;
          background: var(--bg);
          color: var(--fg);
          overflow-y: auto;
        }
        
        /* 全局滚动条样式 */
        body::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        
        body::-webkit-scrollbar-track {
          background: var(--item-bg);
          border-left: 1px solid var(--border);
        }
        
        body::-webkit-scrollbar-thumb {
          background: var(--border);
          border: 1px solid var(--bg);
          border-radius: 999px;
        }
        
        body::-webkit-scrollbar-thumb:hover {
          background: var(--muted);
        }
        
        .section {
          margin: 20px;
          padding: 16px;
          background: var(--panel) !important;
          border: 1px solid var(--border) !important;
          border-radius: 12px;
          animation: fadeInUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        
        .section-title {
          font-weight: 600;
          margin-bottom: 12px;
          display: flex;
          align-items: center;
          gap: 6px;
          color: var(--fg);
        }
        
        .table-wrap {
          border: 1px solid var(--border);
          border-radius: 12px;
          overflow: auto;
          margin-top: 16px;
          background: var(--item-bg);
        }
        
        table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
        }
        
        th, td {
          border-bottom: 1px solid var(--border);
          padding: 12px;
        }
        
        th {
          text-align: left;
          color: var(--muted);
          font-weight: 600;
          position: sticky;
          top: 0;
          background: var(--bg);
          z-index: 10;
        }
        
        .cell {
          min-height: 40px;
          border-radius: 8px;
          padding: 8px;
          background: var(--item-bg);
          border: 1px solid var(--border);
          transition: border-color 0.2s ease, background 0.2s ease;
        }
        
        .cell:hover {
          border-color: rgba(var(--accent-rgb), 0.45);
          background: rgba(var(--accent-rgb), 0.08);
        }
        
        .tag {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 10px;
          border-radius: 999px;
          background: var(--item-bg);
          border: 1px solid var(--border);
          margin: 4px;
          color: var(--fg);
          font-size: 12px;
          transition: border-color 0.2s ease, background 0.2s ease;
        }
        
        .tag:hover {
          border-color: rgba(var(--accent-rgb), 0.45);
          background: rgba(var(--accent-rgb), 0.12);
        }
        
        .btn {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          border: none;
          border-radius: 6px;
          padding: 8px 12px;
          cursor: pointer;
          background: var(--accent);
          color: #fff;
          transition: background 0.2s ease;
        }
        
        .btn:hover {
          background: #1a8f46;
        }
        
        .btn.secondary {
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid var(--border);
          color: var(--fg);
        }
        
        .btn.secondary:hover {
          background: rgba(255, 255, 255, 0.09);
        }
        
        .btn.danger {
          background: #dc2626;
          color: #fff;
        }
        
        .btn.danger:hover {
          background: #b91c1c;
        }
        
        .actions {
          display: flex;
          gap: 8px;
          margin-bottom: 16px;
        }
        
        .hint {
          color: #fca5a5;
          font-size: 12px;
          margin-top: 8px;
          padding: 8px;
          border: 1px solid rgba(220, 38, 38, 0.25);
          background: rgba(220, 38, 38, 0.1);
          border-radius: 6px;
        }
        
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 10px;
          border-radius: 999px;
          background: var(--item-bg);
          border: 1px solid var(--border);
          font-size: 12px;
          color: var(--fg);
          transition: border-color 0.2s ease, background 0.2s ease;
        }
        
        .badge:hover {
          border-color: rgba(var(--accent-rgb), 0.45);
          background: rgba(var(--accent-rgb), 0.12);
        }
        
        .group-name {
          cursor: pointer;
          transition: color 0.2s ease;
        }
        
        .group-name:hover {
          color: var(--accent);
        }
        
        .group-name.active {
          font-weight: 700;
          color: var(--accent);
        }
        
        .chip {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 12px;
          border-radius: 999px;
          border: 1px solid var(--border);
          background: var(--item-bg);
          margin: 4px;
          cursor: pointer;
          color: var(--fg);
          font-size: 12px;
          transition: all 0.2s ease;
        }
        
        .chip:hover {
          border-color: rgba(var(--accent-rgb), 0.45);
          background: rgba(var(--accent-rgb), 0.12);
        }
        
        .chip.active {
          border-color: rgba(138, 180, 248, 0.7);
          background: rgba(138, 180, 248, 0.15);
          box-shadow: 0 0 0 2px rgba(138, 180, 248, 0.25) inset;
          color: var(--fg);
        }
      </style>
  </head>
  <body>
    <div class="section">
      <div class="section-title"><i class="ri-team-line"></i> 组别分工表 </div>
      <div class="actions">
        <button id="openRoles" class="btn secondary"><i class="ri-list-check"></i> 分工列表</button>
        <button id="openGroups" class="btn secondary"><i class="ri-group-line"></i> 分组列表</button>
        <button id="openRules" class="btn secondary"><i class="ri-settings-3-line"></i> 分工规则</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <script>
      // --- Theme Logic ---
      window.applyTheme = (mode, color) => {
        const root = document.documentElement;
        const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const accent = color || '#6ab4ff';
        root.style.setProperty('--accent', accent);
        root.style.setProperty('--accent-rgb', accent.replace('#', '').match(/.{2}/g).map(hex => parseInt(hex, 16)).join(','));
        
        if (isDark) {
          root.style.setProperty('--bg', '#181818');
          root.style.setProperty('--fg', '#e6e6e6');
          root.style.setProperty('--muted', '#aaa');
          root.style.setProperty('--panel', 'rgba(255, 255, 255, 0.04)');
          root.style.setProperty('--item-bg', 'rgba(255, 255, 255, 0.04)');
          root.style.setProperty('--border', '#2a2a2a');
        } else {
          root.style.setProperty('--bg', '#ffffff');
          root.style.setProperty('--fg', '#333333');
          root.style.setProperty('--muted', '#666666');
          root.style.setProperty('--panel', 'rgba(0, 0, 0, 0.04)');
          root.style.setProperty('--item-bg', 'rgba(0, 0, 0, 0.04)');
          root.style.setProperty('--border', '#e0e0e0');
        }
      };

      (async () => {
        try {
          if (window.lowbarAPI?.configGet) {
            const mode = await window.lowbarAPI.configGet('system', 'themeMode') || 'system';
            const color = await window.lowbarAPI.configGet('system', 'themeColor') || '#6ab4ff';
            window.applyTheme(mode, color);
          }
          if (window.lowbarAPI?.onConfigChanged) {
            window.lowbarAPI.onConfigChanged(({ scope, key, value }) => {
              if (scope === 'system') {
                 (async () => {
                   const m = await window.lowbarAPI.configGet('system', 'themeMode') || 'system';
                   const c = await window.lowbarAPI.configGet('system', 'themeColor') || '#6ab4ff';
                   window.applyTheme(m, c);
                 })();
              }
            });
          }
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', async () => {
             const m = await window.lowbarAPI.configGet('system', 'themeMode') || 'system';
             if (m === 'system') {
                const c = await window.lowbarAPI.configGet('system', 'themeColor') || '#6ab4ff';
                window.applyTheme('system', c);
             }
          });
        } catch (e) { console.error('Theme init failed', e); }
      })();

      let channel=''; let caller=''; const studentsChannel='profiles.students.channel'; let currentPick=null; let cfg={ roles:[], groups:[], dynamicRoles:[], rule:{} };
      function el(t,c){const e=document.createElement(t); if(c)e.className=c; return e}
      async function load(){
        try {
          if (window.lowbarAPI?.pluginCall) {
            const res=await window.lowbarAPI.pluginCall(caller,'getConfig'); const r=res?.result||res; cfg=r?.config||{};
          } else if (window.lowbarAPI?.configEnsureDefaults) {
            await window.lowbarAPI.configEnsureDefaults('duty-easy',{
              roles: ['清洁','黑板','值日生'],
              groups: [
                { name: '一组', roles: { '清洁': [], '黑板': [], '值日生': [] } },
                { name: '二组', roles: { '清洁': [], '黑板': [], '值日生': [] } }
              ]
            });
            const all=await window.lowbarAPI.configGetAll('duty-easy'); cfg=all||{};
          } else if (window.pluginAPI?.configEnsureDefaults) {
            await window.pluginAPI.configEnsureDefaults('duty-easy',{});
            const all=await window.pluginAPI.configGetAll('duty-easy'); cfg=all||{};
          }
        } catch (e) {}
        if(!Array.isArray(cfg.roles)) cfg.roles=[]; if(!Array.isArray(cfg.groups)) cfg.groups=[]; if(!Array.isArray(cfg.dynamicRoles)) cfg.dynamicRoles=[]; if(typeof cfg.rule!=='object'||!cfg.rule) cfg.rule={}; render()
      }
      function getDynActive(gi, role){ try{ const d=cfg.rule?.dynamicActiveRole||{}; const giKey=String(gi); const per=d[giKey]||{}; const v=String(per[role]||''); return v }catch (e) { return '' } }
      async function setDynActive(gi, role, roleName){ try{ const res= await window.lowbarAPI?.pluginCall?.(caller,'getConfig'); const r=res?.result||res; const cur=r?.config||{}; const rule=cur.rule||{}; const dyn= typeof rule.dynamicActiveRole==='object'&&rule.dynamicActiveRole?{...rule.dynamicActiveRole}:{ }; const giKey=String(gi); const per= typeof dyn[giKey]==='object'&&dyn[giKey]?{...dyn[giKey]}:{}; per[role]=roleName; dyn[giKey]=per; await window.lowbarAPI?.pluginCall?.(caller,'saveConfig',[{ rule: { ...rule, dynamicActiveRole: dyn } }]); const verify=await window.lowbarAPI?.pluginCall?.(caller,'getConfig'); const rr=verify?.result||verify; cfg=rr?.config||cfg; try{ if(channel) window.lowbarAPI.emitEvent?.(channel,{ type:'update', target:'refresh', value:true }) }catch (e) {} render() }catch (e) {} }
      async function clearDynActive(gi, role){ try{ const res= await window.lowbarAPI?.pluginCall?.(caller,'getConfig'); const r=res?.result||res; const cur=r?.config||{}; const rule=cur.rule||{}; const dyn= typeof rule.dynamicActiveRole==='object'&&rule.dynamicActiveRole?{...rule.dynamicActiveRole}:{ }; const dynIdx= typeof rule.dynamicIndices==='object'&&rule.dynamicIndices?{...rule.dynamicIndices}:{ }; const giKey=String(gi); const per= typeof dyn[giKey]==='object'&&dyn[giKey]?{...dyn[giKey]}:{}; const perIdx= typeof dynIdx[giKey]==='object'&&dynIdx[giKey]?{...dynIdx[giKey]}:{}; delete per[role]; delete perIdx[role]; dyn[giKey]=per; dynIdx[giKey]=perIdx; await window.lowbarAPI?.pluginCall?.(caller,'saveConfig',[{ rule: { ...rule, dynamicActiveRole: dyn, dynamicIndices: dynIdx } }]); const verify=await window.lowbarAPI?.pluginCall?.(caller,'getConfig'); const rr=verify?.result||verify; cfg=rr?.config||cfg; try{ if(channel) window.lowbarAPI.emitEvent?.(channel,{ type:'update', target:'refresh', value:true }) }catch (e) {} render() }catch (e) {} }
      function render(){ const thead=document.getElementById('thead'); const tbody=document.getElementById('tbody'); thead.innerHTML=''; tbody.innerHTML=''; const trh=el('tr'); const th0=el('th'); const curIdx=Number.isFinite(cfg.rule?.currentGroupIndex)?cfg.rule.currentGroupIndex:0; const curName=(cfg.groups||[])[curIdx]?.name||''; th0.innerHTML=`组别 ${curName?`<span class="badge">当前：${curName}</span>`:''}`; trh.appendChild(th0); (cfg.roles||[]).forEach(r=>{ const th=el('th'); th.textContent=r||''; trh.appendChild(th) }); thead.appendChild(trh);
        (cfg.groups||[]).forEach((g,gi)=>{ const tr=el('tr'); const tdGroup=el('td'); tdGroup.textContent=g.name||''; tr.appendChild(tdGroup);
          tdGroup.className='group-name'+(gi===curIdx?' active':''); tdGroup.addEventListener('click',()=>{ setActiveGroup(gi) });
          (cfg.roles||[]).forEach(r=>{ const td=el('td'); const cell=el('div','cell'); const arr=Array.isArray(g.roles?.[r])?g.roles[r]:[]; const isDyn=Array.isArray(cfg.dynamicRoles)?cfg.dynamicRoles.includes(r):false;
            if(isDyn){ const activeName=getDynActive(gi,r); const options=(cfg.roles||[]).filter(roleName=>roleName!=='新分工' && !(Array.isArray(cfg.dynamicRoles)&&cfg.dynamicRoles.includes(roleName))); 
              // 添加"未轮值"按钮
              const noneChip=el('span','chip'); noneChip.innerHTML='<i class="ri-user-unfollow-line"></i> 未轮值'; if(activeName==='' || activeName===null || activeName===undefined) noneChip.classList.add('active'); noneChip.addEventListener('click',()=>{ clearDynActive(gi,r) }); cell.appendChild(noneChip);
              if(options.length===0){ const empty=el('span','badge'); empty.textContent='无可选择分工'; cell.appendChild(empty) } else { options.forEach(roleName=>{ const chip=el('span','chip'); chip.textContent=roleName||''; if(String(roleName||'')===String(activeName||'')) chip.classList.add('active'); chip.addEventListener('click',()=>{ setDynActive(gi,r,roleName) }); cell.appendChild(chip) }) } const badge=el('span','badge'); badge.innerHTML='<i class="ri-repeat-2-line"></i> 已启用动态分工'; cell.appendChild(badge); }
            else { arr.forEach((n,ni)=>{ const t=el('span','tag'); t.textContent=n||''; const rm=document.createElement('button'); rm.className='btn danger'; rm.innerHTML='<i class="ri-close-line"></i>'; rm.addEventListener('click',(e)=>{ e.stopPropagation(); const a=Array.isArray(cfg.groups?.[gi]?.roles?.[r])?cfg.groups[gi].roles[r]:[]; a.splice(ni,1); render() }); t.appendChild(rm); cell.appendChild(t) }); const addBtn=el('button','btn secondary'); addBtn.innerHTML='<i class="ri-add-line"></i> 添加'; addBtn.addEventListener('click',()=>{ if(hasDupRoles()){ showDupHint(); return } currentPick={gi,r}; openStudentsPicker(); }); cell.appendChild(addBtn); }
            td.appendChild(cell); tr.appendChild(td)
          }); tbody.appendChild(tr)
        })
      }
      function hasDupRoles(){ const names=(cfg.roles||[]).map(s=>String(s||'').trim()).filter(Boolean); return names.some((n,idx)=>names.indexOf(n)!==idx) }
      function showDupHint(){ let hint=document.getElementById('grid-dup-hint'); if(!hint){ hint=document.createElement('div'); hint.id='grid-dup-hint'; hint.className='hint'; hint.textContent='存在重复分工名称，请在“分工列表”修改为唯一后再添加'; document.querySelector('.section').appendChild(hint) }
      }
      function openStudentsPicker(){ try{ const url=new URL('../../../Plugins/profiles-selector/index.html', window.location.href); url.searchParams.set('channel', studentsChannel); url.searchParams.set('caller','duty-easy'); const currentStudents = Array.isArray(cfg.groups?.[currentPick.gi]?.roles?.[currentPick.r]) ? cfg.groups[currentPick.gi].roles[currentPick.r] : []; url.searchParams.set('exclude', JSON.stringify(currentStudents)); window.lowbarAPI?.emitEvent?.(channel, { type:'update', target:'floatingUrl', value: url.href }); }catch (e) {} }
      function openRolesList(){ try{ const url=new URL('./roles-list.html', window.location.href); url.searchParams.set('channel', channel); url.searchParams.set('caller',caller); window.lowbarAPI?.emitEvent?.(channel,{ type:'update', target:'floatingUrl', value: url.href }); }catch (e) {} }
      function openGroupsList(){ try{ const url=new URL('./groups-list.html', window.location.href); url.searchParams.set('channel', channel); url.searchParams.set('caller',caller); window.lowbarAPI?.emitEvent?.(channel,{ type:'update', target:'floatingUrl', value: url.href }); }catch (e) {} }
      function openRules(){ try{ const url=new URL('./rules.html', window.location.href); url.searchParams.set('channel', channel); url.searchParams.set('caller',caller); window.lowbarAPI?.emitEvent?.(channel,{ type:'update', target:'floatingUrl', value: url.href }); }catch (e) {} }
      async function save(){ try {
        if (window.lowbarAPI?.pluginCall) {
          await window.lowbarAPI.pluginCall(caller,'saveConfig',[{ groups: cfg.groups }]);
          const res=await window.lowbarAPI.pluginCall(caller,'getConfig'); const r=res?.result||res; cfg=r?.config||cfg;
        } else if (window.lowbarAPI?.configEnsureDefaults) {
          await window.lowbarAPI.configEnsureDefaults('duty-easy',{
            roles: ['清洁','黑板','值日生'],
            groups: [
              { name: '一组', roles: { '清洁': [], '黑板': [], '值日生': [] } },
              { name: '二组', roles: { '清洁': [], '黑板': [], '值日生': [] } }
            ]
          });
          await window.lowbarAPI.configSet('duty-easy','groups',cfg.groups);
          const verify=await window.lowbarAPI.configGetAll('duty-easy'); cfg=verify||cfg;
        } else if (window.pluginAPI?.configEnsureDefaults) {
          await window.pluginAPI.configEnsureDefaults('duty-easy',{});
          await window.pluginAPI.configSet('duty-easy','groups',cfg.groups);
          const verify=await window.pluginAPI.configGetAll('duty-easy'); cfg=verify||cfg;
        }
      } catch (e) {} }
      async function applyNextRule(nextRule) {
        try {
          if (window.lowbarAPI?.pluginCall) {
            await window.lowbarAPI.pluginCall('duty-easy','saveConfig',[{ rule: nextRule }]);
            const res=await window.lowbarAPI.pluginCall('duty-easy','getConfig'); const r=res?.result||res; cfg=r?.config||cfg;
          } else if (window.lowbarAPI?.configEnsureDefaults) {
            await window.lowbarAPI.configEnsureDefaults('duty-easy',{});
            await window.lowbarAPI.configSet('duty-easy','rule', nextRule);
            const verify=await window.lowbarAPI.configGetAll('duty-easy'); cfg=verify||cfg;
          } else if (window.pluginAPI?.configEnsureDefaults) {
            await window.pluginAPI.configEnsureDefaults('duty-easy',{});
            await window.pluginAPI.configSet('duty-easy','rule', nextRule);
            const verify=await window.pluginAPI.configGetAll('duty-easy'); cfg=verify||cfg;
          }
          try { if(channel) window.lowbarAPI.emitEvent?.(channel,{ type:'update', target:'refresh', value:true }); } catch (e) {}
        } catch (e) {}
      }
      async function setActiveGroup(gi){ try{
        const nextRule = { ...(cfg.rule||{}), currentGroupIndex: gi };
        await applyNextRule(nextRule);
        render()
      }catch (e) {} }
      (function(){ try{const u=new URL(window.location.href); channel=String(u.searchParams.get('channel')||''); caller=String(u.searchParams.get('caller')||'')}catch (e) {}
        if(window.lowbarAPI){ if(channel) window.lowbarAPI.subscribe?.(channel); window.lowbarAPI.subscribe?.(studentsChannel); window.lowbarAPI.onEvent?.(async (n,p)=>{ if(p?.type==='update'){ if(n===channel && p.target==='duty.save'){ await save(); await load() } if(n===channel && p.target==='refresh'){ await load() } } if(n===studentsChannel){ const name=String(p?.name||'').trim(); if(p?.type==='pick' && name && currentPick){ if(hasDupRoles()){ currentPick=null; showDupHint(); return } const arr=Array.isArray(cfg.groups?.[currentPick.gi]?.roles?.[currentPick.r])?cfg.groups[currentPick.gi].roles[currentPick.r]:(cfg.groups[currentPick.gi].roles[currentPick.r]=[]); arr.push(name); currentPick=null; render(); try{ window.lowbarAPI.emitEvent?.(channel,{ type:'update', target:'floatingUrl', value:null }); }catch (e) {} } } }); }
        load(); document.getElementById('openRoles').addEventListener('click',openRolesList); document.getElementById('openGroups').addEventListener('click',openGroupsList); document.getElementById('openRules').addEventListener('click',openRules)
      })();
    </script>
  </body>
  </html>
