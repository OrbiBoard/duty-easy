<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分组列表</title>
    <link rel="stylesheet" href="../../../renderer/remixicon-local.css" />
    <link rel="stylesheet" href="../../../renderer/settings.css" />
    <style>
      :root {
        --bg: #181818;
        --fg: #e6e6e6;
        --muted: #aaa;
        --accent: #6ab4ff;
        --accent-rgb: 106, 180, 255;
        --panel: rgba(255, 255, 255, 0.04);
        --item-bg: rgba(255, 255, 255, 0.04);
        --border: #2a2a2a;
      }
      
      html, body {
        height: 100%;
        user-select: none;
        transition: background 0.3s, color 0.3s;
      }
      
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow-y: auto;
      }
      
      /* 全局滚动条样式 */
      body::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      
      body::-webkit-scrollbar-track {
        background: var(--item-bg);
        border-left: 1px solid var(--border);
      }
      
      body::-webkit-scrollbar-thumb {
        background: var(--border);
        border: 1px solid var(--bg);
        border-radius: 999px;
      }
      
      body::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }
      
      .section {
        margin: 20px;
        padding: 16px;
        background: var(--panel) !important;
        border: 1px solid var(--border) !important;
        border-radius: 12px;
        animation: fadeInUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .section-title {
        font-weight: 600;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--fg);
      }
      
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      
      .item {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--border);
        background: var(--item-bg);
        border-radius: 8px;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      
      .item:hover {
        border-color: rgba(var(--accent-rgb), 0.45);
        background: rgba(var(--accent-rgb), 0.08);
      }
      
      .item input {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--item-bg);
        color: var(--fg);
        transition: border-color 0.2s ease;
      }
      
      .item input:focus {
        outline: none;
        border-color: var(--accent);
      }
      
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        transition: background 0.2s ease;
      }
      
      .btn:hover {
        background: #1a8f46;
      }
      
      .btn.secondary {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        color: var(--fg);
      }
      
      .btn.secondary:hover {
        background: rgba(255, 255, 255, 0.09);
      }
      
      .btn.danger {
        background: #dc2626;
        color: #fff;
      }
      
      .btn.danger:hover {
        background: #b91c1c;
      }
      
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="section">
      <div class="section-title"><i class="ri-group-line"></i> 分组列表</div>
      <div id="list" class="list"></div>
      <div class="actions">
        <button id="add" class="btn secondary"><i class="ri-add-line"></i> 新增分组</button>
        <button id="save" class="btn"><i class="ri-save-3-line"></i> 保存</button>
      </div>
    </div>
    <script>
      // --- Theme Logic ---
      window.applyTheme = (mode, color) => {
        const root = document.documentElement;
        const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const accent = color || '#6ab4ff';
        root.style.setProperty('--accent', accent);
        root.style.setProperty('--accent-rgb', accent.replace('#', '').match(/.{2}/g).map(hex => parseInt(hex, 16)).join(','));
        
        if (isDark) {
          root.style.setProperty('--bg', '#181818');
          root.style.setProperty('--fg', '#e6e6e6');
          root.style.setProperty('--muted', '#aaa');
          root.style.setProperty('--panel', 'rgba(255, 255, 255, 0.04)');
          root.style.setProperty('--item-bg', 'rgba(255, 255, 255, 0.04)');
          root.style.setProperty('--border', '#2a2a2a');
        } else {
          root.style.setProperty('--bg', '#ffffff');
          root.style.setProperty('--fg', '#333333');
          root.style.setProperty('--muted', '#666666');
          root.style.setProperty('--panel', 'rgba(0, 0, 0, 0.04)');
          root.style.setProperty('--item-bg', 'rgba(0, 0, 0, 0.04)');
          root.style.setProperty('--border', '#e0e0e0');
        }
      };

      (async () => {
        try {
          if (window.lowbarAPI?.configGet) {
            const mode = await window.lowbarAPI.configGet('system', 'themeMode') || 'system';
            const color = await window.lowbarAPI.configGet('system', 'themeColor') || '#6ab4ff';
            window.applyTheme(mode, color);
          }
          if (window.lowbarAPI?.onConfigChanged) {
            window.lowbarAPI.onConfigChanged(({ scope, key, value }) => {
              if (scope === 'system') {
                 (async () => {
                   const m = await window.lowbarAPI.configGet('system', 'themeMode') || 'system';
                   const c = await window.lowbarAPI.configGet('system', 'themeColor') || '#6ab4ff';
                   window.applyTheme(m, c);
                 })();
              }
            });
          }
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', async () => {
             const m = await window.lowbarAPI.configGet('system', 'themeMode') || 'system';
             if (m === 'system') {
                const c = await window.lowbarAPI.configGet('system', 'themeColor') || '#6ab4ff';
                window.applyTheme('system', c);
             }
          });
        } catch (e) { console.error('Theme init failed', e); }
      })();

      let channel=''; let caller=''; let cfg={ roles:[], groups:[] };
      function el(t,c){ const e=document.createElement(t); if(c) e.className=c; return e }
      async function load(){
        try {
          if (window.lowbarAPI?.pluginCall) {
            const res = await window.lowbarAPI.pluginCall('duty-easy','getConfig'); const r=res?.result||res; cfg=r?.config||{};
          } else if (window.lowbarAPI?.configEnsureDefaults) {
            await window.lowbarAPI.configEnsureDefaults('duty-easy',{
              roles: ['清洁','黑板','值日生'],
              groups: [
                { name: '一组', roles: { '清洁': [], '黑板': [], '值日生': [] } },
                { name: '二组', roles: { '清洁': [], '黑板': [], '值日生': [] } }
              ]
            });
            const all = await window.lowbarAPI.configGetAll('duty-easy'); cfg=all||{};
          } else if (window.pluginAPI?.configEnsureDefaults) {
            await window.pluginAPI.configEnsureDefaults('duty-easy',{});
            const all = await window.pluginAPI.configGetAll('duty-easy'); cfg=all||{};
          }
        } catch (e) {}
        if(!Array.isArray(cfg.roles)) cfg.roles=[]; if(!Array.isArray(cfg.groups)) cfg.groups=[]; render()
      }
      function render(){ const box=document.getElementById('list'); box.innerHTML=''; cfg.groups.forEach((g,idx)=>{ const row=el('div','item'); const inp=document.createElement('input'); inp.value=g.name||''; inp.placeholder='分组名称'; const up=document.createElement('button'); up.className='btn secondary'; up.innerHTML='<i class="ri-arrow-up-s-line"></i>'; const down=document.createElement('button'); down.className='btn secondary'; down.innerHTML='<i class="ri-arrow-down-s-line"></i>'; const del=document.createElement('button'); del.className='btn danger'; del.innerHTML='<i class="ri-delete-bin-line"></i>'; inp.addEventListener('input',()=>{ cfg.groups[idx].name=inp.value }); up.addEventListener('click',()=>{ if(idx>0){ const t=cfg.groups[idx]; cfg.groups[idx]=cfg.groups[idx-1]; cfg.groups[idx-1]=t; render() } }); down.addEventListener('click',()=>{ if(idx<cfg.groups.length-1){ const t=cfg.groups[idx]; cfg.groups[idx]=cfg.groups[idx+1]; cfg.groups[idx+1]=t; render() } }); del.addEventListener('click',()=>{ cfg.groups.splice(idx,1); render() }); row.appendChild(inp); row.appendChild(up); row.appendChild(down); row.appendChild(del); box.appendChild(row) }) }
      function ordinalName(idx){ const CN=['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十']; const i=Math.max(1,Math.min(CN.length, idx)); return `${CN[i-1]}组` }
      function addGroup(){ const ord=(Array.isArray(cfg.groups)?cfg.groups.length:0)+1; const obj={ name: ordinalName(ord), roles:{} }; (cfg.roles||[]).forEach(r=>{ obj.roles[r]=[] }); (cfg.groups||[]).push(obj) }
      async function save(){ try {
        if (window.lowbarAPI?.pluginCall) {
          await window.lowbarAPI.pluginCall('duty-easy', 'saveConfig', [{ groups: cfg.groups }]);
          const res = await window.lowbarAPI.pluginCall('duty-easy', 'getConfig');
          const r = res?.result || res;
          cfg = r?.config || cfg;
          try{ if(channel) window.lowbarAPI.emitEvent?.(channel,{ type:'update', target:'refresh', value:true }) }catch (e) {}
        } else if (window.lowbarAPI?.configEnsureDefaults) {
          await window.lowbarAPI.configEnsureDefaults('duty-easy',{
            roles: [],
            groups: [],
            dynamicRoles: []
          });
          await window.lowbarAPI.configSet('duty-easy','groups',cfg.groups);
          const verify=await window.lowbarAPI.configGetAll('duty-easy'); cfg=verify||cfg;
          try{ if(channel) window.lowbarAPI.emitEvent?.(channel,{ type:'update', target:'refresh', value:true }) }catch (e) {}
        } else if (window.pluginAPI?.configEnsureDefaults) {
          await window.pluginAPI.configEnsureDefaults('duty-easy',{});
          await window.pluginAPI.configSet('duty-easy','groups',cfg.groups);
          const verify=await window.pluginAPI.configGetAll('duty-easy'); cfg=verify||cfg;
          try{ if(channel) window.pluginAPI.emitEvent?.(channel,{ type:'update', target:'refresh', value:true }) }catch (e) {}
        }
      } catch (e) {} }
      (function(){ try{ const u=new URL(window.location.href); channel=String(u.searchParams.get('channel')||''); caller=String(u.searchParams.get('caller')||'') }catch (e) {}
        if(window.lowbarAPI){ if(channel) window.lowbarAPI.subscribe?.(channel); window.lowbarAPI.onEvent?.(async (n,p)=>{ if(n!==channel) return; if(p?.type==='update'){ if(p.target==='duty.save'){ await save(); await load(); render() } } }); }
        load(); document.getElementById('add').addEventListener('click',()=>{ addGroup(); render() });
        document.getElementById('save').addEventListener('click',async ()=>{ await save(); await load(); render() })
      })();
    </script>
  </body>
  </html>
